[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "networking-engine"
version = "0.1.0"
description = "Stateless CLI: natural-language networking queries → evidence-grounded people and outreach hooks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.5",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "openai>=1.54.0",
    "trafilatura>=1.8.0",
    "tenacity>=8.3.0,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.0",
]

[project.scripts]
scout = "networking_engine.cli:main"

[tool.hatch.build.targets.wheel]
only-include = ["networking_engine"]

[tool.hatch.build.targets.wheel.sources]
"src/networking_engine" = "networking_engine"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
